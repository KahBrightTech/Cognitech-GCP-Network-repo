# Infrastructure Manager deployment configuration
# This file defines how Infrastructure Manager should deploy the configuration

deployment:
  name: "int-prod-shared-primary"
  location: "us-central1" # Region where deployment metadata is stored

# Service account used for deployment
# Must have appropriate permissions: roles/editor, roles/compute.networkAdmin, etc.
serviceAccount: "infra-deployer@cognitech-shared-prod.iam.gserviceaccount.com"

# Configuration source
terraformConfig:
  gitSource:
    repository: "https://github.com/KahBrightTech/Cognitech-GCP-Network-repo"
    ref: "main" # Can be branch, tag, or commit SHA
    subpath: "deployments/int-production/shared-account/primary"
  # Optional: You can also pass variables here instead of terraform.tfvars
  # inputVariables:
  #   org:
  #     type: "object"
  #     value:
  #       folders:
  #         production:
  #           display_name: "Production"
  #           parent: "organizations/123456789012"

  # Labels for organization and cost tracking
labels:
  environment: "int-production"
  account: "shared-account"
  region: "primary"
  managed-by: "infrastructure-manager"
  deployment-method: "github-actions"
  team: "platform-engineering"

# Annotations for additional metadata
annotations:
  description: "Production shared services deployment including networking and security"
  owner: "platform-team@cognitechllc.org"
  cost-center: "infrastructure"
  compliance: "sox-compliant"

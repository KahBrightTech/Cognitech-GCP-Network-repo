name: Deploy-Playground-Dev-Project

on:
  push:
    branches:
      - main
      - "*"
    paths:
      - ".github/workflows/deploy-playground-dev-project.yaml"
      - "deployments/cognitechllc/Playground/dev-project/**/*"
  workflow_dispatch:
    inputs:
      infra_manager_action:
        description: "Select the Infrastructure Manager action to perform"
        required: true
        type: choice
        options:
          - "preview"
          - "apply"
          - "destroy"

env:
  GCP_PROJECT_ID: dev-project-1430
  GCP_REGION: us-central1
  DEPLOYMENT_NAME: cognitechllc-playground-dev-project

  WORKLOAD_IDENTITY_PROVIDER: "projects/277761075083/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider"
  SERVICE_ACCOUNT: "infra-manager-sa@dev-project-1430.iam.gserviceaccount.com"

  # The repo + path that actually contains the .tf files AND the terraform.tfvars
  GIT_REPO: "https://github.com/KahBrightTech/Cognitech-GCP-Network-repo"
  GIT_REF: "main"
  GIT_DIRECTORY: "deployments/cognitechllc/Playground/dev-project"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  Preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "latest"

      - name: Set GCP project
        run: gcloud config set project ${{ env.GCP_PROJECT_ID }}

      - name: Preview Infrastructure Manager deployment
        id: preview
        run: |
          echo "🔍 Running Infrastructure Manager preview..."
          
          PREVIEW_NAME="preview-${{ github.run_id }}"
          PREVIEW_PATH="projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/previews/${PREVIEW_NAME}"
          echo "preview_path=${PREVIEW_PATH}" >> $GITHUB_OUTPUT
          
          # Create the preview
          set +e
          gcloud infra-manager previews create ${PREVIEW_PATH} \
            --deployment="projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/deployments/${{ env.DEPLOYMENT_NAME }}" \
            --service-account="projects/${{ env.GCP_PROJECT_ID }}/serviceAccounts/${{ env.SERVICE_ACCOUNT }}" \
            --git-source-repo="${{ env.GIT_REPO }}" \
            --git-source-directory="${{ env.GIT_DIRECTORY }}" \
            --git-source-ref="${{ env.GIT_REF }}" \
            --format=json
          CREATE_EXIT=$?
          set -e

          if [[ "$CREATE_EXIT" -ne 0 ]]; then
            echo "❌ previews create failed; dumping preview diagnostics..."
            gcloud infra-manager previews describe ${PREVIEW_PATH} --format=yaml || true
            exit $CREATE_EXIT
          fi
          
          echo "⏳ Waiting for preview to complete..."
          for i in {1..30}; do
            STATE=$(gcloud infra-manager previews describe ${PREVIEW_PATH} --format="value(state)" 2>/dev/null || echo "UNKNOWN")
            echo "Preview state: $STATE"
            
            if [[ "$STATE" == "SUCCEEDED" ]]; then
              echo "✅ Preview completed successfully!"
              break
            elif [[ "$STATE" == "FAILED" ]]; then
              echo "❌ Preview failed!"
              gcloud infra-manager previews describe ${PREVIEW_PATH} --format=yaml
              exit 1
            fi
            
            sleep 10
          done

      - name: Export and display Terraform plan
        if: always()
        run: |
          echo "📋 Fetching Terraform plan output..."
          
          PREVIEW_PATH="${{ steps.preview.outputs.preview_path }}"
          PREVIEW_STATE=$(gcloud infra-manager previews describe ${PREVIEW_PATH} --format="value(state)" 2>/dev/null || echo "UNKNOWN")
          echo "Preview state for export: ${PREVIEW_STATE}"
          
          # Export only works for SUCCEEDED or STALE previews.
          if [[ "${PREVIEW_STATE}" == "SUCCEEDED" || "${PREVIEW_STATE}" == "STALE" ]]; then
            gcloud infra-manager previews export ${PREVIEW_PATH} \
              --format=json > preview_result.json || true
          else
            echo "Skipping preview export because state is ${PREVIEW_STATE}."
          fi
          
          # Display the preview details
          echo "=== Preview Details ==="
          gcloud infra-manager previews describe ${PREVIEW_PATH} --format=yaml || true
          
          # Try to get the Terraform plan logs
          echo ""
          echo "=== Terraform Plan Output ==="
          if [ -f preview_result.json ]; then
            cat preview_result.json

            JSON_PLAN_URI=$(jq -r '.jsonSignedUri // empty' preview_result.json)
            if [[ -n "${JSON_PLAN_URI}" ]]; then
              echo ""
              echo "Downloading plan JSON from signed URL..."
              curl -sSL "${JSON_PLAN_URI}" -o plan.json

              echo ""
              echo "=== Terraform Plan Summary ==="
              jq -r '
                if (.resource_changes // [] | length) == 0 then
                  "No resource changes."
                else
                  (
                    .resource_changes
                    | map(.change.actions | join("/"))
                    | group_by(.)
                    | map({action: .[0], count: length})
                    | .[]
                    | "\(.action): \(.count)"
                  )
                end
              ' plan.json

              echo ""
              echo "=== Resource Changes (address -> actions) ==="
              jq -r '
                (.resource_changes // [])[]
                | "\(.address) -> \(.change.actions | join("/"))"
              ' plan.json
            else
              echo "No jsonSignedUri found in preview export output."
            fi
          else
            echo "preview_result.json was not generated."
          fi
          
          # Alternative: Check for plan in deployment logs
          echo ""
          echo "=== Checking Deployment Status ==="
          gcloud infra-manager deployments describe \
            projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/deployments/${{ env.DEPLOYMENT_NAME }} \
            --format=yaml 2>/dev/null || echo "Deployment not yet created"

  Approve:
    needs: Preview
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.infra_manager_action == 'apply' &&
      github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Awaiting approval before applying changes
        run: echo "✅ Approved by ${{ github.actor }}"

  Apply:
    needs: Approve
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.infra_manager_action == 'apply' &&
      github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "latest"

      - name: Set GCP project
        run: gcloud config set project ${{ env.GCP_PROJECT_ID }}

      - name: Apply Infrastructure Manager deployment
        run: |
          echo "🚀 Applying infrastructure changes..."
          gcloud infra-manager deployments apply \
            projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/deployments/${{ env.DEPLOYMENT_NAME }} \
            --service-account="projects/${{ env.GCP_PROJECT_ID }}/serviceAccounts/${{ env.SERVICE_ACCOUNT }}" \
            --git-source-repo="${{ env.GIT_REPO }}" \
            --git-source-directory="${{ env.GIT_DIRECTORY }}" \
            --git-source-ref="${{ env.GIT_REF }}" \
            --labels="environment=playground,managed-by=github-actions,applied-by=${{ github.actor }}" \
            --format=json
          echo "✅ Applied."

      - name: Get deployment details
        if: always()
        run: |
          gcloud infra-manager deployments describe \
            projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/deployments/${{ env.DEPLOYMENT_NAME }} \
            --format=yaml

  Destroy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.infra_manager_action == 'destroy' &&
      github.ref == 'refs/heads/main'
    environment:
      name: production-destroy
    defaults:
      run:
        shell: bash
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: "access_token"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: "latest"

      - name: Set GCP project
        run: gcloud config set project ${{ env.GCP_PROJECT_ID }}

      - name: Destroy Infrastructure Manager deployment
        run: |
          echo "🗑️ Destroying infrastructure..."
          gcloud infra-manager deployments delete \
            projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/deployments/${{ env.DEPLOYMENT_NAME }} \
            --delete-policy=DELETE \
            --quiet
          echo "✅ Destroyed."